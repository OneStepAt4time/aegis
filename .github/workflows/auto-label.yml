name: Auto Label Issues

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/actions/auto-label/package-lock.json
      - name: Install action dependencies
        working-directory: .github/actions/auto-label
        run: npm ci
      - name: Run auto-labeler
        uses: ./.github/actions/auto-label
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-title: ${{ github.event.issue.title }}
          issue-body: ${{ github.event.issue.body }}
          issue-number: ${{ github.event.issue.number }}
          existing-labels: ${{ join(github.event.issue.labels.*.name, ',') }}
